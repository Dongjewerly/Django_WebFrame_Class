{% if question_list %}
    <ul>
        {% for question in question_list %}
        <li>
<!--            <a href="/pybo/{{ question.id }}/">-->
            <a href="{% url 'pybo:detail' question.id %}">
                {{ question.subject }}
            </a>
        </li>
        {% endfor %}
    </ul>
{% else %}
    <p>질문없습니다</p>
{% endif %}
